<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResuMatch AI - 智能简历诊断</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 h-screen overflow-hidden">

  <div class="flex h-screen">

    <!-- 左侧栏 -->
    <aside class="w-64 bg-white border-r border-gray-100 flex flex-col">
      <div class="p-4 border-b border-gray-100">
        <div class="flex items-center gap-2 mb-4">
          <div class="w-8 h-8 bg-teal-500 rounded-lg flex items-center justify-center text-white font-bold">R</div>
          <span class="font-semibold text-sm">ResuMatch AI</span>
        </div>
        <button onclick="location.reload()" class="w-full bg-teal-50 text-teal-700 py-2 rounded-lg text-sm font-medium hover:bg-teal-100 transition">
          + 新建诊断
        </button>
      </div>

      <div class="flex-1 p-4 overflow-y-auto">
        <div class="text-xs text-gray-400 mb-2 px-1">提示</div>
        <div class="text-xs text-gray-500 px-1 leading-relaxed">
          上传一份 PDF 或 Word 简历，系统会自动匹配 132 条真实岗位，并对 Top1 岗位做多智能体诊断。
        </div>
      </div>

      <div class="p-4 border-t border-gray-100 space-y-1 text-sm text-gray-600">
        <div class="px-3 py-2 rounded-lg hover:bg-gray-50 cursor-pointer">📊 能力画像</div>
        <div class="px-3 py-2 rounded-lg hover:bg-gray-50 cursor-pointer">⚙️ 设置</div>
      </div>
    </aside>

    <!-- 中间品牌区 -->
    <main class="flex-1 flex items-center justify-center p-12">
      <div class="max-w-md text-center">
        <div class="w-20 h-20 bg-teal-500 rounded-2xl flex items-center justify-center text-4xl mx-auto mb-6 shadow-lg shadow-teal-200">
          🎯
        </div>
        <h1 class="text-4xl font-bold mb-2 leading-tight">
          <span class="text-gray-900">智能简历诊断</span><br>
          <span class="text-teal-500">助你拿到 Offer</span>
        </h1>
        <p class="text-gray-500 mt-5 leading-relaxed">
          上传简历，系统自动匹配岗位库，<br>
          多智能体深度诊断，产出可落地的改写建议。
        </p>

        <div class="grid grid-cols-2 gap-3 mt-10 text-left">
          <div class="bg-white p-4 rounded-xl border border-gray-100">
            <div class="text-2xl mb-2">🎯</div>
            <div class="font-medium text-sm">智能匹配</div>
            <div class="text-xs text-gray-500 mt-1">关键词 + 语义混合排序</div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-gray-100">
            <div class="text-2xl mb-2">🤖</div>
            <div class="font-medium text-sm">多智能体诊断</div>
            <div class="text-xs text-gray-500 mt-1">4 个 Agent 协同分析</div>
          </div>
        </div>
      </div>
    </main>

    <!-- 右侧表单 -->
    <aside class="w-96 bg-white border-l border-gray-100 p-6 overflow-y-auto">
      <div class="space-y-6">

        <!-- 1. 上传 -->
        <div>
          <div class="flex items-center gap-2 mb-2 text-sm font-medium">
            <span class="w-5 h-5 bg-teal-500 text-white rounded-full text-xs flex items-center justify-center">1</span>
            上传简历（PDF / Word）
          </div>
          <label class="border-2 border-dashed border-gray-200 rounded-xl p-6 block text-center cursor-pointer hover:border-teal-500 transition">
            <input type="file" id="resumeFile" accept=".pdf,.docx,.doc" class="hidden">
            <div class="text-gray-400 text-sm">
              <div class="text-2xl mb-1">📄</div>
              <span id="fileName">点击上传简历</span>
            </div>
          </label>
        </div>

        <!-- 2. JD -->
        <div>
          <div class="flex items-center gap-2 mb-2 text-sm font-medium">
            <span class="w-5 h-5 bg-gray-300 text-white rounded-full text-xs flex items-center justify-center">2</span>
            目标岗位 <span class="text-gray-400 text-xs font-normal">（选填）</span>
          </div>
          <textarea id="jdText" rows="3"
            class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:border-teal-500 resize-none"
            placeholder="粘贴目标 JD，系统将针对性诊断"></textarea>
        </div>

        <!-- 3. 城市 -->
        <div>
          <div class="flex items-center gap-2 mb-2 text-sm font-medium">
            <span class="w-5 h-5 bg-gray-300 text-white rounded-full text-xs flex items-center justify-center">3</span>
            期望城市
          </div>
          <select id="city" class="w-full border border-gray-200 rounded-lg p-2.5 text-sm focus:outline-none focus:border-teal-500">
            <option>北京</option>
            <option>上海</option>
            <option>深圳</option>
            <option>广州</option>
            <option>杭州</option>
          </select>
        </div>

        <!-- 4. TopK -->
        <div>
          <div class="flex items-center gap-2 mb-2 text-sm font-medium">
            <span class="w-5 h-5 bg-gray-300 text-white rounded-full text-xs flex items-center justify-center">4</span>
            推荐岗位数量
          </div>
          <div class="flex items-center gap-3">
            <input type="range" id="topK" min="3" max="20" value="10" class="flex-1 accent-teal-500">
            <span id="topKValue" class="text-teal-600 font-semibold w-8 text-center">10</span>
          </div>
          <div class="text-xs text-gray-400 mt-1.5">建议 10 个，兼顾覆盖面与速度</div>
        </div>

        <!-- 按钮 -->
        <button id="startBtn"
          class="w-full bg-teal-500 text-white py-3 rounded-lg font-medium hover:bg-teal-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
          ✨ 开始诊断
        </button>

        <div id="statusMsg" class="text-xs text-center hidden"></div>

      </div>
    </aside>

  </div>

  <script>
    const fileInput = document.getElementById('resumeFile');
    const fileNameEl = document.getElementById('fileName');
    const jdTextEl = document.getElementById('jdText');
    const cityEl = document.getElementById('city');
    const topKEl = document.getElementById('topK');
    const topKValueEl = document.getElementById('topKValue');
    const startBtn = document.getElementById('startBtn');
    const statusMsg = document.getElementById('statusMsg');

    // 文件选择显示文件名
    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (f) fileNameEl.textContent = f.name;
    });

    // 滑块
    topKEl.addEventListener('input', () => {
      topKValueEl.textContent = topKEl.value;
    });

    function showStatus(msg, type = 'info') {
      statusMsg.textContent = msg;
      statusMsg.className = 'text-xs text-center ' + (
        type === 'error' ? 'text-red-500' :
        type === 'ok'    ? 'text-teal-600' :
        'text-gray-500'
      );
    }

    // 开始诊断：上传简历 → 保存 resume_id → 跳转 result.html
    startBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        showStatus('请先选择简历文件', 'error');
        return;
      }

      startBtn.disabled = true;
      startBtn.textContent = '上传中...';
      showStatus('正在上传简历...');

      try {
        // 1. 上传简历
        const form = new FormData();
        form.append('file', file);

        const uploadRes = await fetch('/api/v1/resumes/upload', {
          method: 'POST',
          body: form,
        });
        if (!uploadRes.ok) {
          const err = await uploadRes.json().catch(() => ({}));
          throw new Error(err.detail || '上传失败');
        }
        const uploadData = await uploadRes.json();
        const resumeId = uploadData.id;

        showStatus('上传成功，正在跳转诊断页面...', 'ok');

        // 2. 把参数暂存到 sessionStorage
        sessionStorage.setItem('resume_id', resumeId);
        sessionStorage.setItem('jd_text', jdTextEl.value || '');
        sessionStorage.setItem('city', cityEl.value || '');
        sessionStorage.setItem('top_k', topKEl.value || '10');

        // 3. 跳转
        location.href = '/frontend/result.html';

      } catch (e) {
        console.error(e);
        showStatus('失败：' + e.message, 'error');
        startBtn.disabled = false;
        startBtn.textContent = '✨ 开始诊断';
      }
    });
  </script>

</body>
</html>
